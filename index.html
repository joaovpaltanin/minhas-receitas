<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Minhas Receitas — delícias caseiras feitas com carinho. Explore receitas culinárias.">
    <title>Minhas Receitas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧑‍🍳</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="container header-inner">
            <div class="header-text">
                <h1>Minhas Receitas</h1>
                <p class="subtitle">Delícias caseiras feitas com carinho</p>
            </div>
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar por nome ou ingrediente...">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="recipes-grid" id="recipesGrid"></div>
        <div class="no-results" id="noResults" style="display: none;">
            <svg class="no-results-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="8" x2="14" y2="14"></line>
                <line x1="14" y1="8" x2="8" y2="14"></line>
            </svg>
            <p>Nenhuma receita encontrada</p>
            <span>Tente buscar com outros termos</span>
        </div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()" aria-label="Fechar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-image-wrapper">
                <img class="modal-image" id="modalImage" src="" alt="">
                <div class="modal-image-gradient"></div>
            </div>
            <div class="modal-body">
                <div class="modal-header">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <a class="media-btn" id="modalMediaLink" href="" target="_blank" rel="noopener noreferrer" aria-label="Assistir vídeo da receita">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                        Vídeo da receita
                    </a>
                </div>
                <div class="modal-variations" id="modalVariations"></div>
                <div class="variation-description" id="modalVariationDescription"></div>

                <div class="section">
                    <h3 class="section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                        Ingredientes
                    </h3>
                    <ul class="ingredients-list" id="modalIngredients"></ul>
                </div>

                <div class="section">
                    <h3 class="section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        Modo de Preparo
                    </h3>
                    <div class="instructions" id="modalInstructions"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Feito com <span class="heart">&#10084;</span> para amantes da cozinha</p>
        </div>
    </footer>

    <!-- Botão flutuante de cadastro -->
    <button class="fab-btn" id="fabBtn" onclick="openAgente()" aria-label="Cadastrar nova receita" title="Cadastrar nova receita">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <!-- Painel do Agente de Cadastro -->
    <div class="agente-overlay" id="agenteOverlay">
        <div class="agente-panel">
            <button class="agente-close-btn" onclick="closeAgente()" aria-label="Fechar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="agente-header">
                <span class="agente-icon">🧑‍🍳</span>
                <div>
                    <h2 class="agente-title">Nova Receita</h2>
                    <p class="agente-subtitle">Use para cadastrar a partir de foto, vídeo ou texto</p>
                </div>
            </div>

            <!-- Abas -->
            <div class="agente-tabs" role="tablist">
                <button class="agente-tab active" role="tab" onclick="switchTab('foto')" id="tab-foto">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    Foto
                </button>
                <button class="agente-tab" role="tab" onclick="switchTab('link')" id="tab-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                    Link de Vídeo
                </button>
                <button class="agente-tab" role="tab" onclick="switchTab('texto')" id="tab-texto">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Texto
                </button>
            </div>

            <!-- Conteúdo das abas -->
            <div class="agente-tab-content" id="content-foto">
                <label class="upload-area" id="uploadArea">
                    <input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="onFotoChange(this)">
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span>Clique ou arraste uma foto da receita</span>
                        <small>JPG, PNG, WEBP até 10 MB</small>
                    </div>
                    <img id="fotoPreview" class="foto-preview" src="" alt="Preview" style="display:none">
                </label>
            </div>

            <div class="agente-tab-content" id="content-link" style="display:none">
                <div class="input-group">
                    <label class="input-label" for="linkInput">Link do YouTube ou outro vídeo de receita</label>
                    <input type="url" id="linkInput" class="agente-input" placeholder="https://www.youtube.com/watch?v=...">
                </div>
            </div>

            <div class="agente-tab-content" id="content-texto" style="display:none">
                <div class="input-group">
                    <label class="input-label" for="textoInput">Descreva a receita</label>
                    <textarea id="textoInput" class="agente-textarea" placeholder="Cole ou escreva o texto da receita aqui. Quanto mais detalhado, melhor o resultado..."></textarea>
                </div>
            </div>

            <!-- Mensagem de erro/sucesso -->
            <div class="agente-msg" id="agenteMsg" style="display:none"></div>

            <!-- Botão de envio -->
            <button class="agente-submit-btn" id="agenteSubmitBtn" onclick="cadastrarReceita()">
                <span id="submitBtnText">Cadastrar Receita</span>
                <div class="btn-spinner" id="btnSpinner" style="display:none"></div>
            </button>
        </div>
    </div>

    <script src="receitas.js" defer></script>
    <script src="scripts.js" defer></script>
    <script src="agente.js" defer></script>
</body>

</html>
